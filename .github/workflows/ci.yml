name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Smoke test
        run: |
          node bin/faas.js run examples/resize.js && node bin/faas.js load --seconds 10 && node bin/faas.js compare
